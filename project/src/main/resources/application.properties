spring.application.name=project

# PostgreSQL; supply Neon connection details through the environment.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Authentication secrets and token lifetimes.
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.issuer=${JWT_ISSUER:review-engine}
app.security.jwt.access-token-minutes=${JWT_ACCESS_TOKEN_MINUTES:15}
app.security.refresh-token-days=${REFRESH_TOKEN_DAYS:30}
app.security.cookie.secure=${COOKIE_SECURE:true}
app.security.cookie.same-site=${COOKIE_SAME_SITE:Strict}
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.security.google.client-id=${GOOGLE_CLIENT_ID:}
app.security.otp.hmac-secret=${OTP_HMAC_SECRET}
app.security.otp.expiry-minutes=${OTP_EXPIRY_MINUTES:5}
app.security.otp.resend-cooldown-seconds=${OTP_RESEND_COOLDOWN_SECONDS:60}
app.security.otp.max-attempts=${OTP_MAX_ATTEMPTS:5}
app.email.from=${EMAIL_FROM:no-reply@localhost}
app.email.dev-return-otp=${DEV_RETURN_OTP:false}
app.customer.phone.encryption-key=${PHONE_ENCRYPTION_KEY}
app.customer.phone.hmac-key=${PHONE_HMAC_KEY}
app.customer.phone.default-region=${PHONE_DEFAULT_REGION:ZZ}