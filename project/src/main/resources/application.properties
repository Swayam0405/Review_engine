spring.application.name=project

# PostgreSQL; supply Neon connection details through the environment.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Authentication secrets and token lifetimes.
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.issuer=${JWT_ISSUER:review-engine}
app.security.jwt.access-token-minutes=${JWT_ACCESS_TOKEN_MINUTES:15}
app.security.refresh-token-days=${REFRESH_TOKEN_DAYS:30}
app.security.cookie.secure=${COOKIE_SECURE:true}
app.security.cookie.same-site=${COOKIE_SAME_SITE:Strict}
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.security.google.client-id=${GOOGLE_CLIENT_ID:}
app.security.otp.hmac-secret=${OTP_HMAC_SECRET}
app.security.otp.expiry-minutes=${OTP_EXPIRY_MINUTES:5}
app.security.otp.resend-cooldown-seconds=${OTP_RESEND_COOLDOWN_SECONDS:60}
app.security.otp.max-attempts=${OTP_MAX_ATTEMPTS:5}
app.email.from=${EMAIL_FROM:no-reply@localhost}
app.email.dev-return-otp=${DEV_RETURN_OTP:false}
app.customer.phone.encryption-key=${PHONE_ENCRYPTION_KEY}
app.customer.phone.hmac-key=${PHONE_HMAC_KEY}
app.customer.phone.default-region=${PHONE_DEFAULT_REGION:ZZ}

# Feedback links use a stable HMAC-derived opaque token; keep this key durable and private.
review-engine.feedback.token-secret=${FEEDBACK_TOKEN_SECRET}
review-engine.feedback.token-expiry=${FEEDBACK_TOKEN_EXPIRY:14d}
review-engine.feedback.public-base-url=${FEEDBACK_PUBLIC_BASE_URL:http://localhost:3000/feedback}
review-engine.feedback.rate-limit-per-minute=${FEEDBACK_RATE_LIMIT_PER_MINUTE:30}
review-engine.feedback.expiry-poll-interval-ms=${FEEDBACK_EXPIRY_POLL_INTERVAL_MS:60000}

# n8n integration is opt-in. The internal API key is separate from the outbound n8n API key.
review-engine.n8n.enabled=${N8N_ENABLED:false}
review-engine.n8n.base-url=${N8N_BASE_URL:}
review-engine.n8n.api-key=${N8N_API_KEY:}
review-engine.n8n.internal-api-key=${N8N_INTERNAL_API_KEY:}
review-engine.n8n.feedback-schedule-webhook=${N8N_FEEDBACK_SCHEDULE_WEBHOOK:}
review-engine.n8n.callback-secret=${N8N_CALLBACK_SECRET:}
review-engine.n8n.poll-interval-ms=${N8N_POLL_INTERVAL_MS:5000}

# Provider-independent AI settings; disabled by default for local/test startup.
review-engine.ai.enabled=${AI_ENABLED:false}
review-engine.ai.provider=${AI_PROVIDER:openai-compatible}
review-engine.ai.api-key=${AI_API_KEY:}
review-engine.ai.model=${AI_MODEL:gpt-4o-mini}
review-engine.ai.base-url=${AI_BASE_URL:https://api.openai.com/v1}
review-engine.ai.timeout=${AI_TIMEOUT:20s}
review-engine.ai.max-retries=${AI_MAX_RETRIES:2}
review-engine.ai.max-prompt-characters=${AI_MAX_PROMPT_CHARACTERS:20000}
review-engine.ai.max-follow-up-questions=${AI_MAX_FOLLOW_UP_QUESTIONS:3}
review-engine.ai.max-analysis-batch=${AI_MAX_ANALYSIS_BATCH:20}
review-engine.ai.rate-limit-per-minute=${AI_RATE_LIMIT_PER_MINUTE:10}
review-engine.ai.worker-interval=${AI_WORKER_INTERVAL:5s}

# Dashboard defaults; all dates are interpreted as UTC instants.
review-engine.dashboard.default-period-days=${DASHBOARD_DEFAULT_PERIOD_DAYS:30}
review-engine.dashboard.max-date-range-days=${DASHBOARD_MAX_DATE_RANGE_DAYS:366}
review-engine.dashboard.recurring-issue-min-feedback-count=${DASHBOARD_RECURRING_ISSUE_MIN_FEEDBACK_COUNT:2}
review-engine.dashboard.default-result-limit=${DASHBOARD_DEFAULT_RESULT_LIMIT:20}